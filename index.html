<style>

<h1>Dasturlash texnologiyalari — test mashqi</h1><div class="sub">Mashq rejimi · Barcha mavzular (<span id="tot"></span> ta savol)</div>

ash tili kompilyatori turi", "Ma’lumotlar bazasini boshqarish turi", "Tizimni modellashtiruvchi vizual til"], "c": 3}, {"q": "Use case diagrammasi nimani ko’rsatadi?", "o": ["Foydalanuvchi va tizim aloqasini", "Server apparat tuzilmasini ko’rinishini", "Sinflarning ichki kodini tuzilishini", "Ma’lumotlar bazasi jadvallarini"], "c": 0}, {"q": "Class diagrammasida nimalar tasvirlanadi?", "o": ["Sinflar, atributlar va bog’lanishlar", "Loyiha byudjeti va muddatlari", "Tarmoq topologiyasi va qurilmalar", "Foydalanuvchi ssenariylari ro’yxati"], "c": 0}, {"q": "Sifatli (clean) kodning asosiy belgisi qaysi?", "o": ["Bitta katta funksiyadan iborat", "O’qilishi va tushunilishi oson", "Izohlarning yo’qligi", "Juda qisqa o’zgaruvchi nomlari"], "c": 1}, {"q": "\"Clean Code\" kitobining muallifi kim?", "o": ["Ian Sommerville", "Robert Martin", "Linus Torvalds", "Martin Fowler"], "c": 1}, {"q": "\"Refactoring\" kitobining muallifi kim?", "o": ["Ian Sommerville", "Erich Gamma", "Martin Fowler", "Robert Martin"], "c": 2}, {"q": "Refactoring nima?", "o": ["Dasturni boshqa tilga o’tkazish", "Dasturga yangi funksiyalar qo’shish", "Kodni butunlay o’chirib qayta yozish", "Tashqi xatti-harakatni o’zgartirmay tartiblash"], "c": 3}, {"q": "DRY prinsipi nimani anglatadi?", "o": ["Testlarni o’tkazib yuborish", "Izohlarni ko’paytirish", "Faqat qisqa kod yozish", "Kodni takrorlamaslik"], "c": 3}, {"q": "KISS prinsipi nimani talab qiladi?", "o": ["Kodni shifrlab, murakkab yozish", "Murakkab arxitektura tanlab olish", "Har bir qatorga izoh yozib chiqish", "Yechimni imkon qadar sodda qilish"], "c": 3}, {"q": "SOLID’dagi \"S\" harfi nimani bildiradi?", "o": ["Single Responsibility", "Static Structure Rule", "Simple Syntax Rule", "Secure Storage Rule"], "c": 0}, {"q": "Style guide nima uchun kerak?", "o": ["Serverni to’g’ri sozlash va ishlatish", "Foydalanuvchi interfeysini bezash", "Kod yozishning yagona qoidalarini belgilash", "Dasturni tezroq kompilyatsiya qilish"], "c": 2}, {"q": "O’zgaruvchi nomi qanday bo’lishi kerak?", "o": ["Tasodifiy belgilar ketma-ketligi", "Imkon qadar bitta harfdan iborat", "Doim katta harflarda yozilgan", "Vazifasini aniq ifodalovchi"], "c": 3}, {"q": "Code smell nima?", "o": ["Dastur ishlashidagi to’liq uzilish", "Kodda yashirin muammo borligi belgisi", "Kompilyator chiqargan xatolik xabari", "Xavfsizlik tizimining ogohlantirishi"], "c": 1}, {"q": "Design pattern nima?", "o": ["Interfeys dizayni uchun shablon", "Tayyor dasturiy kutubxona to’plami", "Takrorlanuvchi muammoga umumiy yechim", "Dasturlash tilining maxsus operatori"], "c": 2}, {"q": "Singleton pattern nimani ta’minlaydi?", "o": ["Sinfning faqat bitta nusxasi bo’lishini", "Sinflar o’rtasida vorislik bo’lishini", "Sinfning ko’p nusxalari yaratilishini", "Obyektlar avtomatik o’chirilishini"], "c": 0}, {"q": "Factory pattern nima uchun ishlatiladi?", "o": ["Obyektlarni xotiradan o’chirib tashlash", "Obyekt yaratishni alohida qismga ajratish", "Tarmoq so’rovlarini serverga yuborish", "Ma’lumotlarni shifrlab saqlab qo’yish"], "c": 1}, {"q": "Observer pattern qanday ishlaydi?", "o": ["Holat o’zgarsa, obunachilarga xabar beradi", "Sinflarni bir-biriga qo’shib yuboradi", "Obyektni faqat bir marta yaratib beradi", "Xatolarni avtomatik ravishda tuzatadi"], "c": 0}, {"q": "Design pattern’lar asosan nechta turga bo’linadi?", "o": ["Ikkita: oddiy va murakkab turlarga", "Uchta: yaratuvchi, tuzilmaviy, xulq-atvor", "Bitta: faqat yagona umumiy turga", "To’rtta: kichik, o’rta, katta, global"], "c": 1}, {"q": "Unit test nimani tekshiradi?", "o": ["Faqat ma’lumotlar bazasini", "Butun tizimni foydalanuvchi nuqtai nazaridan", "Faqat interfeys dizaynini", "Dasturning eng kichik qismini alohida"], "c": 3}, {"q": "Integration test nimani tekshiradi?", "o": ["Faqat interfeys ranglari mosligini", "Faqat bitta funksiya ishlashini", "Modullarning birgalikda ishlashini", "Kompilyatorning ishlash tezligini"], "c": 2}, {"q": "Test piramidasida eng ko’p yoziladigan testlar qaysi?", "o": ["Yuklama test const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let N=10,cur=[],state=[];
$('tot').textContent=DATA.length;
try{const s=localStorage.getItem('fio');if(s)$('nm').value=s}catch(e){}
const opts=[10,20,30,DATA.length].filter((v,i,a)=>v<=DATA.length&&a.indexOf(v)===i);
if(opts.indexOf(N)<0)N=opts[0];
opts.forEach(v=>{const b=document.createElement('button');b.className='chip'+(v===N?' on':'');b.textContent=v===DATA.length?'Hammasi':v;b.onclick=()=>{N=v;[...$('cnt').children].forEach(c=>c.classList.remove('on'));b.classList.add('on')};$('cnt').appendChild(b)});
let idx=0;
function run(items){
  cur=shuf(items).map(q=>({q:q.q,o:shuf(q.o.map((t,i)=>({t,ok:i===q.c}))),raw:q}));
  state=cur.map(()=>null);idx=0;
  $('setup').classList.add('hid');$('res').classList.add('hid');$('quiz').classList.remove('hid');show();window.scrollTo(0,0)}
function show(){
  const q=cur[idx],c=$('card');
  c.innerHTML='<div class="qn">Savol '+(idx+1)+' / '+cur.length+'</div><div class="qt"></div>';
  c.querySelector('.qt').textContent=q.q;
  const ans=state[idx]!==null;
  const bs=q.o.map((o,oi)=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>{if(state[idx]!==null)return;state[idx]=oi;show()};c.appendChild(b);return b});
  if(ans)bs.forEach((x,i)=>{x.disabled=true;if(q.o[i].ok)x.classList.add('ok');else if(i===state[idx])x.classList.add('bad')});
  const last=idx===cur.length-1;
  $('prev').disabled=idx===0;$('prev').style.opacity=idx===0?.4:1;
  $('next').classList.toggle('hid',last);
  $('next').textContent=ans?'Keyingi →':'O‘tkazish →';
  $('fin').classList.toggle('sec',!last);
  const a=state.filter(x=>x!==null).length;
  $('prog').textContent='Javob berilgan: '+a+' / '+cur.length}
$('prev').onclick=()=>{if(idx>0){idx--;show()}};
$('next').onclick=()=>{if(idx<cur.length-1){idx++;show()}};
$('start').onclick=()=>{const n=$('nm').value.trim();if(!n){$('nm').focus();return}
  try{localStorage.setItem('fio',n)}catch(e){}
  run(shuf(DATA).slice(0,N))};
$('fin').onclick=()=>{
  const right=cur.filter((q,i)=>state[i]!==null&&q.o[state[i]].ok).length;
  $('sc').textContent=right+' / '+cur.length+' ('+Math.round(right/cur.length*100)+'%)';
  $('who').textContent=$('nm').value.trim()+' · javob berilmagan: '+state.filter(x=>x===null).length;
  $('quiz').classList.add('hid');$('res').classList.remove('hid');$('redo').classList.toggle('hid',right===cur.length);
  window.scrollTo(0,0)};
$('redo').onclick=()=>{const w=cur.filter((q,i)=>state[i]===null||!q.o[state[i]].ok).map(q=>q.raw);run(w)};
$('again').onclick=()=>{$('quiz').classList.add('hid');$('res').classList.add('hid');$('setup').classList.remove('hid');window.scrollTo(0,0)};
</script></body></html>
